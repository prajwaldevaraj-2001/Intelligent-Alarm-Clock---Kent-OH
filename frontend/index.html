<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Intelligent Alarm Clock - Kent, OH</title>
  <link rel="stylesheet" href="styles.css" />
  <script defer src="scripts.js"></script>
</head>
<body>
  <div class="container">
    <h1>🚨 Intelligent Alarm Clock - Kent, OH</h1>

    <div class="card">
      <h2>⏰ Current Time</h2>
      <div id="clock" class="content-box"></div>
    </div>

    <div class="card">
      <h2>🌦️ Weather Info</h2>
      <div id="weather" class="content-box">Loading weather...</div>
    </div>

    <div class="card">
      <h2>🚌 Transit Status</h2>
      <div id="transit" class="content-box">Loading transit data...</div>
    </div>

    <div class="card alert-card">
      <h2>🔔 Alerts</h2>
      <div id="alerts" class="content-box">Checking...</div>
    </div>

    <p class="footer">🔄 Auto-updates every 30 seconds</p>
  </div>
</body>
</html>
